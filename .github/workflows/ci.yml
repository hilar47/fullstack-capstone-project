name: Lint Code

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint_js:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install JSHint
        run: npm install jshint --global

      - name: Run Linter
        run: |
          find . -name "*.js" -not -path "./node_modules/*" -not -path "./frontend/*" -not -path "*/node_modules/*" -exec jshint {} +